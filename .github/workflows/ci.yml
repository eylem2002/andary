name: CI

# Free-tier friendly: the full checks on Linux with one Node matrix, the unit and integration
# tests once on macOS and Windows (after the Linux checks pass), a single end-to-end job,
# cancelled when a newer commit lands, with hard timeouts. Public repositories pay nothing;
# private ones pay more for macOS (10x) and Windows (2x) minutes, so those run one Node only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1' # weekly: catch newly published advisories

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the secrets scan reads the whole history
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-fund
      - run: npm audit --audit-level=high
      - run: npm run lint
      - name: Install config linters
        # Pinned by hash: actionlint's release archive (sha256 from its published checksums) and
        # yamllint with its dependencies (pip --require-hashes). A throwaway virtualenv: Ubuntu
        # runners refuse system-wide pip installs (PEP 668).
        run: |
          release=https://github.com/rhysd/actionlint/releases/download/v1.7.12
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" "$release/actionlint_1.7.12_linux_amd64.tar.gz"
          sha=8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          echo "$sha  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/lint-bin"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/lint-bin" actionlint
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/pip" install --quiet --require-hashes -r .github/lint-requirements.txt
          echo "$RUNNER_TEMP/lint-bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/lint-venv/bin" >> "$GITHUB_PATH"
      - run: npm run lint:config
      - run: npm run typecheck
      - run: npm run deadcode
      - run: npm run boundaries
      - run: npm test
      - run: npm run licenses
      - run: npm run secrets

  other-os:
    name: Unit and integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    needs: checks
    # Windows has not passed a run yet (no Windows machine was available while porting): its
    # result is reported without failing the workflow until it has been green for a while.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm test

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
